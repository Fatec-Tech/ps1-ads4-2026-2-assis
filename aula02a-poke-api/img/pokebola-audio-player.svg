<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Poké Bola com player de áudio</title>
  <desc id="desc">Ícone circular inspirado em uma Poké Bola, com botão de reprodução e ondas sonoras no centro.</desc>

  <defs>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
    <linearGradient id="redTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c68"/>
      <stop offset="1" stop-color="#e5394f"/>
    </linearGradient>
    <linearGradient id="whiteBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#182230" flood-opacity=".22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Corpo da Poké Bola -->
    <circle cx="256" cy="256" r="220" fill="url(#whiteBottom)"/>
    <path d="M36 256a220 220 0 0 1 440 0H36Z" fill="url(#redTop)" clip-path="url(#ballClip)"/>

    <!-- Faixa central -->
    <rect x="36" y="238" width="440" height="36" fill="#182230"/>

    <!-- Contorno externo -->
    <circle cx="256" cy="256" r="220" fill="none" stroke="#182230" stroke-width="18"/>

    <!-- Núcleo central/player -->
    <circle cx="256" cy="256" r="82" fill="#182230"/>
    <circle cx="256" cy="256" r="64" fill="#ffffff" stroke="#dce4ee" stroke-width="5"/>

    <!-- Botão de reprodução -->
    <path d="M238 218 304 256 238 294Z" fill="#e5394f"/>

    <!-- Ondas sonoras -->
    <path d="M325 226c12 17 12 43 0 60" fill="none" stroke="#182230" stroke-width="8" stroke-linecap="round"/>
    <path d="M344 212c21 25 21 63 0 88" fill="none" stroke="#182230" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
