<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokédex Simplificada</title>
		<!-- Bootstrap 5 CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
			rel="stylesheet"
		/>
		<style>
			@font-face {
				font-family: 'Pokemon Solid';
				src: url('fonts/Pokemon%20Solid.ttf') format('truetype');
				font-display: swap;
			}
			body {
				font-family: 'Nunito', sans-serif;
			}
			.pokemon-font {
				font-family: 'Pokemon Solid', 'Nunito', sans-serif;
				letter-spacing: 0.04em;
			}
			.stat-progress {
				position: relative;
				overflow: visible;
			}
			.stat-progress .progress-bar {
				width: var(--stat-width);
				animation: fillStatBar 1s cubic-bezier(0.16, 1, 0.3, 1) both;
			}
			.skeleton-card {
				min-height: 300px;
				background: linear-gradient(90deg, #e9ecef 25%, #f8f9fa 50%, #e9ecef 75%);
				background-size: 200% 100%;
				animation: skeletonLoading 1.4s ease-in-out infinite;
			}
			.skeleton-image {
				height: 160px;
				background-color: rgba(173, 181, 189, 0.35);
			}
			.skeleton-line {
				height: 14px;
				border-radius: 999px;
				background-color: rgba(173, 181, 189, 0.45);
			}
			.pokemon-modal-image {
				width: min(100%, 240px);
				max-height: 220px;
				object-fit: contain;
			}
			.pokemon-modal-dialog {
				width: calc(100vw - 32px);
				max-width: 1440px;
				height: calc(100vh - 32px);
				margin: 16px auto;
			}
			.pokemon-modal-dialog .modal-content {
				height: 100%;
				border: 0;
				border-radius: 1.25rem;
				overflow: hidden;
			}
			.pokemon-modal-dialog .modal-header {
				padding: 1rem 1.5rem;
				color: #fff;
				background: #151923;
				border-bottom: 4px solid var(--pokemon-color, #5969bb);
			}
			.pokemon-modal-dialog .btn-close {
				filter: invert(1) grayscale(100%) brightness(300%);
			}
			.pokemon-modal-dialog .modal-body {
				padding: clamp(1rem, 3vw, 2.5rem);
				background: #f3f4fa;
			}
			.pokemon-overview {
				padding: 0;
				border: 0 !important;
				border-radius: 0.75rem;
				color: #202630;
				background: #fff;
				box-shadow: 0 0.5rem 1rem rgba(21, 25, 35, 0.12);
			}
			.pokemon-overview-media {
				position: relative;
				min-height: 280px;
				overflow: hidden;
				background: linear-gradient(145deg, var(--pokemon-color, #5969bb), var(--pokemon-color-dark, #374151));
			}
			.pokemon-overview-media img {
				position: relative;
				z-index: 1;
			}
			.pokemon-cry-button {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				position: absolute;
				z-index: 2;
				bottom: 1rem;
				left: 50%;
				transform: translateX(-50%);
				white-space: nowrap;
				padding: 0.45rem 0.85rem 0.45rem 0.5rem;
				border: 1px solid rgba(255, 255, 255, 0.7);
				color: #202630;
				background: rgba(255, 255, 255, 0.92);
				box-shadow: 0 0.35rem 0.75rem rgba(21, 25, 35, 0.18);
			}
			.pokemon-cry-icon {
				width: 30px;
				height: 30px;
				object-fit: contain;
			}
			.pokemon-cry-button.is-playing {
				color: #fff;
				background: rgba(21, 25, 35, 0.9);
			}
			.pokemon-cry-button:hover,
			.pokemon-cry-button:focus-visible {
			color: #202630;
			background: #fff;
		}
			.pokemon-overview .text-secondary {
				color: #6c757d !important;
			}
			.pokemon-overview .bg-light {
				color: #202630;
				background: #f3f4f6 !important;
			}
			.pokemon-detail-section {
				padding: 1.25rem;
				border: 1px solid #e3e6ed;
				border-radius: 0.75rem;
				background: #fff;
			}
			.pokemon-detail-section h6 {
				color: #343a46;
				font-weight: 700;
				font-size: 0.75rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}
			.ability-item {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				min-height: 58px;
				padding: 0.75rem 1rem;
				border: 0;
				border-radius: 0.6rem;
				color: #fff;
				background: linear-gradient(135deg, var(--pokemon-color, #5969bb), var(--pokemon-color-dark, #374151));
				box-shadow: 0 0.25rem 0.6rem rgba(21, 25, 35, 0.12);
				transition: transform 0.2s ease, box-shadow 0.2s ease;
			}
			.ability-item:hover {
				transform: translateY(-2px);
				box-shadow: 0 0.45rem 0.8rem rgba(21, 25, 35, 0.18);
			}
			.ability-number {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 28px;
				height: 28px;
				flex: 0 0 28px;
				border-radius: 50%;
				color: var(--pokemon-color-dark, #374151);
				font-size: 0.75rem;
				font-weight: 800;
				background: rgba(255, 255, 255, 0.92);
			}
			.ability-name {
				font-weight: 800;
			}
			.ability-hidden-label {
				color: rgba(255, 255, 255, 0.75) !important;
				font-size: 0.65rem;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			@media (max-width: 576px) {
				.pokemon-overview-media {
					min-height: 220px;
				}
				.pokemon-modal-dialog {
					width: calc(100vw - 16px);
					height: calc(100vh - 16px);
					margin: 8px auto;
				}
			}
			@keyframes skeletonLoading {
				from { background-position: 200% 0; }
				to { background-position: -200% 0; }
			}
			.stat-progress .stat-pokemon {
				position: absolute;
				top: 50%;
				left: calc(var(--stat-width) + 4px);
				width: 18px;
				height: 18px;
				background-color: var(--stat-color);
				mask: url("img/pokemon_121114.svg") center / contain no-repeat;
				-webkit-mask: url("img/pokemon_121114.svg") center / contain no-repeat;
				transform: translate(-50%, -50%);
				animation: moveStatPokeball 1s cubic-bezier(0.16, 1, 0.3, 1) both, hideStatPokeball 0.25s ease-out 1s forwards;
			}
			@keyframes fillStatBar {
				from { width: 0; }
				to { width: var(--stat-width); }
			}
			@keyframes moveStatPokeball {
				0% {
					left: 0;
					transform: translate(-50%, -50%);
				}
				90% {
					left: calc(var(--stat-width) + 2px);
					transform: translate(-50%, -50%);
				}
				100% {
					left: calc(var(--stat-width) + 4px);
					transform: translate(-50%, -50%);
				}
			}
			@keyframes hideStatPokeball {
				from { opacity: 1; }
				to { opacity: 0; visibility: hidden; }
			}
			.pokemon-card {
				position: relative;
				overflow: hidden;
				border: 0 !important;
				border-radius: 1rem;
				background: #fff;
				transition: transform 0.2s ease, box-shadow 0.2s ease;
			}
			.pokemon-card:hover {
				transform: translateY(-6px);
				box-shadow: 0 0.75rem 1.5rem rgba(21, 25, 35, 0.14) !important;
			}
			.pokemon-card:focus-visible {
				outline: 3px solid var(--card-type-color, #6c757d);
				outline-offset: 3px;
			}
			.pokemon-card-image {
				position: relative;
				min-height: 190px;
				overflow: hidden;
				background: linear-gradient(145deg, var(--card-type-color, #6c757d), var(--card-type-dark, #343a40));
			}
			.pokemon-card-image::before,
			.pokemon-overview-media::before {
				content: '';
				position: absolute;
				width: 190px;
				height: 190px;
				right: -70px;
				bottom: -100px;
				border: 22px solid rgba(255, 255, 255, 0.16);
				border-radius: 50%;
			}
			.pokemon-card-image::after,
			.pokemon-overview-media::after {
				content: '';
				position: absolute;
				width: 120px;
				height: 120px;
				left: -55px;
				top: -55px;
				border: 15px solid rgba(255, 255, 255, 0.1);
				border-radius: 50%;
			}
			.pokemon-card-image img {
				position: relative;
				z-index: 1;
				transition: transform 0.25s ease;
			}
			.pokemon-card:hover .pokemon-card-image img {
				transform: scale(1.08);
			}
			.pokemon-card .card-title {
				font-size: 1.2rem;
				color: #202630;
				letter-spacing: 0.08em;
			}
			.pokemon-modal-dialog .modal-title,
			.pokemon-overview h4 {
				letter-spacing: 0.08em;
			}
			.pokemon-card .pokemon-number {
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.08em;
			}
			.pokemon-card .pokemon-details-hint {
				color: var(--card-type-color, #6c757d);
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			.pokemon-card .card-body {
				padding: 1.25rem;
			}
			.pokemon-card .badge-type {
				padding: 0.45em 0.75em;
				font-size: 0.7rem;
				font-weight: 800;
				letter-spacing: 0.04em;
			}
			.badge-type {
				text-transform: capitalize;
				margin-right: 4px;
			}
		</style>
	</head>
	<body class="bg-light">
		<div class="container py-5">
			<header class="text-center mb-5">
				<h1 class="pokemon-font display-4 fw-bold text-danger">Pokédex</h1>
			</header>

			<!-- Área de Busca / Filtro -->
			<div class="row justify-content-center mb-4">
				<div class="col-md-6">
					<div class="input-group">
						<input
							type="text"
							id="searchInput"
							class="form-control"
							placeholder="Buscar por nome (ex: pikachu, charizard)..."
						/>
						<button class="btn btn-danger" type="button" id="searchBtn">
							Buscar
						</button>
					</div>
				</div>
			</div>

			<!-- Grid onde as cartas dos Pokémon serão inseridas -->
			<div
				class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
				id="pokemonGrid"
			></div>

			<div id="pokemonSentinel" class="py-2" aria-hidden="true"></div>

		</div>

		<!-- Modal de detalhes do Pokémon -->
		<div class="modal fade" id="pokemonModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog pokemon-modal-dialog modal-dialog-centered modal-dialog-scrollable">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title pokemon-font text-capitalize" id="pokemonModalTitle">
							Detalhes
						</h5>
						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Fechar"
						></button>
					</div>
					<div class="modal-body" id="pokemonModalBody">
						<!-- Conteúdo inserido dinamicamente via JavaScript -->
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
					</div>
				</div>
			</div>
		</div>

		<!-- JavaScript / Lógica com Fetch -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		></script>
		<script src="js/app.js"></script>
	</body>
</html>
