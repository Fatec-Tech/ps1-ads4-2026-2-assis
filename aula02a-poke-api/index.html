<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokédex Simplificada</title>
		<!-- Bootstrap 5 CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
			rel="stylesheet"
		/>
		<style>
			@font-face {
				font-family: 'Pokemon Solid';
				src: url('fonts/Pokemon%20Solid.ttf') format('truetype');
				font-display: swap;
			}
			body {
				font-family: 'Nunito', sans-serif;
				background: #e7eee8 !important;
			}
			.pokemon-font {
				font-family: 'Pokemon Solid', 'Nunito', sans-serif;
				letter-spacing: 0.04em;
			}
			.stat-progress {
				position: relative;
				overflow: visible;
			}
			.stat-progress .progress-bar {
				width: var(--stat-width);
				animation: fillStatBar 1s cubic-bezier(0.16, 1, 0.3, 1) both;
			}
			.skeleton-card {
				min-height: 300px;
				background: linear-gradient(90deg, #e9ecef 25%, #f8f9fa 50%, #e9ecef 75%);
				background-size: 200% 100%;
				animation: skeletonLoading 1.4s ease-in-out infinite;
			}
			.skeleton-image {
				height: 160px;
				background-color: rgba(173, 181, 189, 0.35);
			}
			.skeleton-line {
				height: 14px;
				border-radius: 999px;
				background-color: rgba(173, 181, 189, 0.45);
			}
			.pokemon-modal-image {
				width: min(100%, 240px);
				max-height: 220px;
				object-fit: contain;
			}
			.pokemon-modal-dialog {
				width: 100vw;
				max-width: none;
				height: 100vh;
				margin: 0;
			}
			.pokemon-modal-dialog .modal-content {
				height: 100%;
				border: 0;
				border-radius: 0;
				overflow: hidden;
				background: var(--pokemon-color-dark, #182230);
			}
			.pokemon-modal-close {
				position: absolute;
				top: 1rem;
				right: 1.5rem;
				z-index: 4;
				display: grid;
				width: 42px;
				height: 42px;
				place-items: center;
				padding: 0;
				border: 1px solid rgba(255, 255, 255, 0.65);
				border-radius: 50%;
				color: #fff;
				font-size: 1.7rem;
				line-height: 1;
				background: rgba(21, 25, 35, 0.6);
				transition: background 0.2s ease, transform 0.2s ease;
			}
			.pokemon-modal-close:hover,
			.pokemon-modal-close:focus-visible {
				color: #fff;
				background: rgba(21, 25, 35, 0.9);
				transform: scale(1.05);
			}
			.pokemon-modal-dialog .modal-body {
				position: relative;
				height: 100%;
				padding: clamp(1rem, 3vw, 2.5rem);
				overflow-x: hidden;
				background:
					radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.14) 0 7rem, transparent 7.1rem),
					radial-gradient(circle at 94% 82%, rgba(255, 255, 255, 0.12) 0 10rem, transparent 10.1rem),
					linear-gradient(145deg, var(--pokemon-color-dark, #182230), var(--pokemon-color, #5969bb));
			}
			.pokemon-modal-dialog .modal-footer {
				display: none;
			}
			.pokemon-overview {
				padding: clamp(1rem, 3vw, 2rem);
				border: 1px solid rgba(255, 255, 255, 0.28) !important;
				border-radius: 0.75rem;
				color: #fff;
				background: rgba(255, 255, 255, 0.12);
				backdrop-filter: blur(18px);
				-webkit-backdrop-filter: blur(18px);
				box-shadow: 0 0.75rem 2rem rgba(21, 25, 35, 0.2);
			}
			.pokemon-overview-stage {
				display: grid;
				grid-template-columns: minmax(150px, 0.8fr) minmax(280px, 1.4fr) minmax(150px, 0.8fr);
				align-items: center;
				gap: 1rem;
			}
			.pokemon-overview-media {
				position: relative;
				min-height: 400px;
				overflow: hidden;
				background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03));
			}
			.pokemon-overview-side {
				padding: 1rem;
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 0.65rem;
				background: rgba(255, 255, 255, 0.08);
			}
			.pokemon-overview-name {
				margin-top: 1.5rem;
				padding-top: 1rem;
				border-top: 1px solid rgba(255, 255, 255, 0.22);
			}
			.pokemon-overview-media img {
				position: relative;
				z-index: 1;
			}
			.pokemon-cry-button {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				position: absolute;
				z-index: 2;
				bottom: 1rem;
				left: 50%;
				transform: translateX(-50%);
				white-space: nowrap;
				padding: 0.45rem 0.85rem 0.45rem 0.5rem;
				border: 1px solid rgba(255, 255, 255, 0.7);
				color: #202630;
				background: rgba(255, 255, 255, 0.92);
				box-shadow: 0 0.35rem 0.75rem rgba(21, 25, 35, 0.18);
			}
			.pokemon-cry-icon {
				width: 30px;
				height: 30px;
				object-fit: contain;
			}
			.pokemon-cry-button.is-playing {
				color: #fff;
				background: rgba(21, 25, 35, 0.9);
			}
			.pokemon-cry-button:hover,
			.pokemon-cry-button:focus-visible {
			color: #202630;
			background: #fff;
		}
			.pokemon-overview .text-secondary {
				color: rgba(255, 255, 255, 0.72) !important;
			}
			.pokemon-overview .bg-light {
				color: #fff;
				background: rgba(255, 255, 255, 0.14) !important;
			}
			.pokemon-detail-section {
				padding: 1.25rem;
				border: 1px solid rgba(255, 255, 255, 0.28);
				border-radius: 0.75rem;
				color: #fff;
				background: rgba(255, 255, 255, 0.12);
				backdrop-filter: blur(18px);
				-webkit-backdrop-filter: blur(18px);
			}
			.pokemon-detail-section h6 {
				color: #fff;
				font-weight: 700;
				font-size: 0.75rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}
			.pokemon-detail-section .text-secondary {
				color: rgba(255, 255, 255, 0.72) !important;
			}
			.ability-item {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				min-height: 42px;
				padding: 0.55rem 0;
				border-bottom: 1px solid rgba(255, 255, 255, 0.2);
				color: #fff;
			}
			.ability-item:last-child { border-bottom: 0; }
			.abilities-list {
				display: flex;
				flex-direction: column;
				gap: 0.65rem;
			}
			.ability-number {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 28px;
				height: 28px;
				flex: 0 0 28px;
				border-radius: 50%;
				border: 1px solid rgba(255, 255, 255, 0.35);
				color: #fff;
				font-size: 0.75rem;
				font-weight: 800;
				background: rgba(255, 255, 255, 0.16);
			}
			.ability-name {
				font-weight: 800;
			}
			.ability-hidden-label {
				color: rgba(255, 255, 255, 0.75) !important;
				font-size: 0.65rem;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			.pokemon-hud-layout {
				display: grid;
				grid-template-columns: minmax(210px, 0.8fr) minmax(360px, 1.8fr) minmax(210px, 0.8fr);
				align-items: center;
				gap: clamp(1rem, 3vw, 3rem);
				min-height: calc(100vh - 10rem);
			}
			.pokemon-hud-column {
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}
			.pokemon-hud-card {
				padding: 1.1rem;
				border: 1px solid rgba(255, 255, 255, 0.28);
				border-radius: 0.75rem;
				color: #fff;
				background: rgba(255, 255, 255, 0.12);
				backdrop-filter: blur(18px);
				-webkit-backdrop-filter: blur(18px);
			}
			.pokemon-hud-card h6 {
				margin-bottom: 1rem;
				color: #fff;
				font-size: 0.72rem;
				font-weight: 800;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}
			.pokemon-hud-card .text-secondary {
				color: rgba(255, 255, 255, 0.72) !important;
			}
			.pokemon-hud-card .progress {
				background: rgba(255, 255, 255, 0.18);
			}
			.pokemon-hud-hero {
				position: relative;
				display: flex;
				min-height: 520px;
				align-items: center;
				justify-content: center;
			}
			.pokemon-hud-hero::before {
				content: '';
				position: absolute;
				width: min(40vw, 520px);
				height: min(40vw, 520px);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 50%;
				box-shadow: 0 0 0 28px rgba(255, 255, 255, 0.04), 0 0 0 56px rgba(255, 255, 255, 0.03);
				animation: heroCircleRotate 14s linear infinite;
				pointer-events: none;
			}
			.pokemon-hud-hero:hover::before {
				animation-play-state: paused;
			}
			.pokemon-hud-hero-image {
				position: relative;
				z-index: 1;
				width: min(42vw, 620px);
				max-height: 72vh;
				object-fit: contain;
				filter: drop-shadow(0 1.5rem 1.5rem rgba(0, 0, 0, 0.28));
				animation: heroFloatCentered 4s ease-in-out infinite;
			}
			.pokemon-hud-hero-sprite-audio {
				position: absolute;
				bottom: 1.5rem;
				left: 50% !important;
				right: auto !important;
				z-index: 3;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.4rem;
				transform: translateX(-50%);
			}
			.pokemon-hud-hero-sprite-carousel {
				position: absolute;
				bottom: 1.5rem;
				left: 50% !important;
				right: auto !important;
				z-index: 2;
				display: flex;
				align-items: center;
				width: min(100%, 420px);
				transform: translateX(-50%);
			}
			.pokemon-hud-hero-sprite-carousel .carousel-inner {
				order: 2;
				flex: 1 1 auto;
				min-width: 0;
				width: 100%;
			}
			.pokemon-hud-hero-sprite-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 0.25rem;
			}
			.pokemon-hud-hero-sprite {
				width: 78px;
				height: 78px;
				object-fit: contain;
				filter: none;
			}
			.pokemon-hud-hero .pokemon-cry-button {
				position: relative;
				bottom: auto;
				left: auto;
				transform: none;
			}
			.pokemon-hud-hero-sprite-carousel .carousel-control-prev,
			.pokemon-hud-hero-sprite-carousel .carousel-control-next {
				position: static !important;
				order: 1;
				flex: 0 0 1.75rem;
				width: 1.75rem;
				top: auto;
				bottom: auto;
				height: 2rem;
				transform: none;
			}
			.pokemon-hud-hero-sprite-carousel .carousel-control-next {
				order: 3;
			}
			.pokemon-hud-hero .pokemon-cry-icon {
				width: 26px;
				height: 26px;
			}
			.pokemon-hud-hero-sprite-audio .pokemon-cry-audio {
				display: none;
			}
			.pokemon-hud-hero-sprite-audio img {
				object-fit: contain;
			}
			.pokemon-hud-hero-sprite-audio .pokemon-hud-hero-sprite {
				max-height: 78px;
				object-fit: contain;
			}
			@keyframes heroFloat {
				0%, 100% { transform: translateY(0); }
				50% { transform: translateY(-8px); }
			}
			@keyframes heroFloatCentered {
				0%, 100% { transform: translateY(-3rem); }
				50% { transform: translateY(calc(-3rem - 8px)); }
			}
			@keyframes heroCircleRotate {
				from { transform: rotate(0deg); }
				to { transform: rotate(360deg); }
			}
			@media (max-width: 992px) {
				.pokemon-hud-layout {
					grid-template-columns: 1fr 1fr;
				}
				.pokemon-hud-hero {
					grid-column: 1 / -1;
					grid-row: 1;
					min-height: 420px;
				}
			}
			@media (max-width: 768px) {
				.pokemon-modal-close {
					right: 1rem;
				}
				.pokemon-overview-media {
					min-height: 220px;
				}
				.pokemon-overview-stage {
					grid-template-columns: 1fr;
				}
				.pokemon-overview-side {
					padding: 0.85rem;
				}
				.pokemon-modal-dialog {
					width: 100vw;
					height: 100vh;
					margin: 0;
				}
				.pokemon-hud-hero-sprite {
					width: 58px;
					height: 58px;
				}
				.pokemon-hud-hero-sprite-audio {
					bottom: 1rem;
					gap: 0.15rem;
				}
				.pokemon-hud-hero-sprite-carousel {
					bottom: 1rem;
					width: min(100%, 300px);
				}
				.pokemon-hud-hero .pokemon-cry-button {
					padding-right: 0.55rem;
				}
			}
			@keyframes skeletonLoading {
				from { background-position: 200% 0; }
				to { background-position: -200% 0; }
			}
			.stat-progress .stat-pokemon {
				position: absolute;
				top: 50%;
				left: calc(var(--stat-width) + 4px);
				width: 18px;
				height: 18px;
				background-color: var(--stat-color);
				mask: url("img/pokemon_121114.svg") center / contain no-repeat;
				-webkit-mask: url("img/pokemon_121114.svg") center / contain no-repeat;
				transform: translate(-50%, -50%);
				animation: moveStatPokeball 1s cubic-bezier(0.16, 1, 0.3, 1) both, hideStatPokeball 0.25s ease-out 1s forwards;
			}
			@keyframes fillStatBar {
				from { width: 0; }
				to { width: var(--stat-width); }
			}
			@keyframes moveStatPokeball {
				0% {
					left: 0;
					transform: translate(-50%, -50%);
				}
				90% {
					left: calc(var(--stat-width) + 2px);
					transform: translate(-50%, -50%);
				}
				100% {
					left: calc(var(--stat-width) + 4px);
					transform: translate(-50%, -50%);
				}
			}
			@keyframes hideStatPokeball {
				from { opacity: 1; }
				to { opacity: 0; visibility: hidden; }
			}
			.pokemon-card {
				position: relative;
				overflow: hidden;
				border: 1px solid rgba(255, 255, 255, 0.75) !important;
				border-radius: 1rem;
				background: rgba(255, 255, 255, 0.48);
				backdrop-filter: blur(18px);
				-webkit-backdrop-filter: blur(18px);
				transition: transform 0.2s ease, box-shadow 0.2s ease;
			}
			.pokemon-card:hover {
				transform: translateY(-6px);
				box-shadow: 0 0.75rem 1.5rem rgba(21, 25, 35, 0.14) !important;
			}
			.pokemon-card:focus-visible {
				outline: 3px solid var(--card-type-color, #6c757d);
				outline-offset: 3px;
			}
			.pokemon-card-image {
				position: relative;
				min-height: 190px;
				overflow: hidden;
				background: linear-gradient(145deg, var(--card-type-color, #6c757d), var(--card-type-dark, #343a40));
				box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.22);
			}
			.pokemon-card-image::before,
			.pokemon-overview-media::before {
				content: '';
				position: absolute;
				width: 190px;
				height: 190px;
				right: -70px;
				bottom: -100px;
				border: 22px solid rgba(255, 255, 255, 0.16);
				border-radius: 50%;
			}
			.pokemon-card-image::after,
			.pokemon-overview-media::after {
				content: '';
				position: absolute;
				width: 120px;
				height: 120px;
				left: -55px;
				top: -55px;
				border: 15px solid rgba(255, 255, 255, 0.1);
				border-radius: 50%;
			}
			.pokemon-card-image img {
				position: relative;
				z-index: 1;
				transition: transform 0.25s ease;
			}
			.pokemon-card:hover .pokemon-card-image img {
				transform: scale(1.08);
			}
			.pokemon-card .card-title {
				font-size: 1.2rem;
				color: #202630;
				letter-spacing: 0.08em;
			}
			.pokemon-modal-dialog .modal-title,
			.pokemon-overview h4 {
				letter-spacing: 0.08em;
			}
			.pokemon-card .pokemon-number {
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.08em;
			}
			.pokemon-card .pokemon-details-hint {
				color: var(--card-type-color, #6c757d);
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			.pokemon-card .card-body {
				padding: 1.25rem;
				background: rgba(255, 255, 255, 0.22);
			}
			.pokemon-card .badge-type {
				padding: 0.45em 0.75em;
				font-size: 0.7rem;
				font-weight: 800;
				letter-spacing: 0.04em;
			}
			.badge-type {
				text-transform: capitalize;
				margin-right: 4px;
			}
		</style>
	</head>
	<body class="bg-light">
		<div class="container py-5">
			<header class="text-center mb-5">
				<h1 class="pokemon-font display-4 fw-bold text-danger">Pokédex</h1>
			</header>

			<!-- Área de Busca / Filtro -->
			<div class="row justify-content-center mb-4">
				<div class="col-md-6">
					<div class="input-group">
						<input
							type="text"
							id="searchInput"
							class="form-control"
							placeholder="Buscar por nome (ex: pikachu, charizard)..."
						/>
						<button class="btn btn-danger" type="button" id="searchBtn">
							Buscar
						</button>
					</div>
				</div>
			</div>

			<!-- Grid onde as cartas dos Pokémon serão inseridas -->
			<div
				class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
				id="pokemonGrid"
			></div>

			<div id="pokemonSentinel" class="py-2" aria-hidden="true"></div>

		</div>

		<!-- Modal de detalhes do Pokémon -->
		<div class="modal fade" id="pokemonModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog pokemon-modal-dialog modal-dialog-centered modal-dialog-scrollable">
				<div class="modal-content">
					<button type="button" class="pokemon-modal-close" data-bs-dismiss="modal" aria-label="Fechar">&times;</button>
					<div class="modal-body" id="pokemonModalBody">
						<!-- Conteúdo inserido dinamicamente via JavaScript -->
					</div>
				</div>
			</div>
		</div>

		<!-- JavaScript / Lógica com Fetch -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		></script>
		<script src="js/app.js"></script>
	</body>
</html>
