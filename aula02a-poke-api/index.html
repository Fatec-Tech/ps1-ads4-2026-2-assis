<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokédex Simplificada</title>
		<!-- Bootstrap 5 CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<style>
			.stat-progress {
				position: relative;
				overflow: visible;
			}
			.stat-progress .progress-bar {
				width: var(--stat-width);
				animation: fillStatBar 1s cubic-bezier(0.16, 1, 0.3, 1) both;
			}
			.skeleton-card {
				min-height: 300px;
				background: linear-gradient(90deg, #e9ecef 25%, #f8f9fa 50%, #e9ecef 75%);
				background-size: 200% 100%;
				animation: skeletonLoading 1.4s ease-in-out infinite;
			}
			.skeleton-image {
				height: 160px;
				background-color: rgba(173, 181, 189, 0.35);
			}
			.skeleton-line {
				height: 14px;
				border-radius: 999px;
				background-color: rgba(173, 181, 189, 0.45);
			}
			@keyframes skeletonLoading {
				from { background-position: 200% 0; }
				to { background-position: -200% 0; }
			}
			.stat-progress .stat-pokemon {
				position: absolute;
				top: 50%;
				left: calc(var(--stat-width) + 4px);
				width: 18px;
				height: 18px;
				background-color: var(--stat-color);
				mask: url("img/pokemon_121114.svg") center / contain no-repeat;
				-webkit-mask: url("img/pokemon_121114.svg") center / contain no-repeat;
				transform: translate(-50%, -50%);
				animation: moveStatPokeball 1s cubic-bezier(0.16, 1, 0.3, 1) both, hideStatPokeball 0.25s ease-out 1s forwards;
			}
			@keyframes fillStatBar {
				from { width: 0; }
				to { width: var(--stat-width); }
			}
			@keyframes moveStatPokeball {
				0% {
					left: 0;
					transform: translate(-50%, -50%);
				}
				90% {
					left: calc(var(--stat-width) + 2px);
					transform: translate(-50%, -50%);
				}
				100% {
					left: calc(var(--stat-width) + 4px);
					transform: translate(-50%, -50%);
				}
			}
			@keyframes hideStatPokeball {
				from { opacity: 1; }
				to { opacity: 0; visibility: hidden; }
			}
			.pokemon-card {
				transition: transform 0.2s ease-in-out;
			}
			.pokemon-card:hover {
				transform: translateY(-5px);
			}
			.badge-type {
				text-transform: capitalize;
				margin-right: 4px;
			}
		</style>
	</head>
	<body class="bg-light">
		<div class="container py-5">
			<header class="text-center mb-5">
				<h1 class="display-4 fw-bold text-danger">Pokédex</h1>
				<p class="lead text-secondary">
					Carregando dados da PokéAPI utilizando `fetch`
				</p>
			</header>

			<!-- Área de Busca / Filtro -->
			<div class="row justify-content-center mb-4">
				<div class="col-md-6">
					<div class="input-group">
						<input
							type="text"
							id="searchInput"
							class="form-control"
							placeholder="Buscar por nome (ex: pikachu, charizard)..."
						/>
						<button class="btn btn-danger" type="button" id="searchBtn">
							Buscar
						</button>
					</div>
				</div>
			</div>

			<!-- Grid onde as cartas dos Pokémon serão inseridas -->
			<div
				class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
				id="pokemonGrid"
			></div>

			<div id="pokemonSentinel" class="py-2" aria-hidden="true"></div>

		</div>

		<!-- Modal de detalhes do Pokémon -->
		<div class="modal fade" id="pokemonModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title text-capitalize" id="pokemonModalTitle">
							Detalhes
						</h5>
						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Fechar"
						></button>
					</div>
					<div class="modal-body" id="pokemonModalBody">
						<!-- Conteúdo inserido dinamicamente via JavaScript -->
					</div>
				</div>
			</div>
		</div>

		<!-- JavaScript / Lógica com Fetch -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		></script>
		<script src="js/app.js"></script>
	</body>
</html>
