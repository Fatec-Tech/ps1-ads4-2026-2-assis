<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Cadastro de Pacientes</title>

		<!-- Bootstrap via CDN, apenas para estilização básica -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/css/flag-icons.min.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css">
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="container py-5">

<!-- Estrutura do Modal de Erro -->
<div class="modal fade" id="modalDeErro" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow">
      
      <!-- Botão de fechar discreto no topo -->
      <div class="modal-header border-0 pb-0 justify-content-end">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      
      <!-- Corpo centralizado com ícone -->
      <div class="modal-body text-center pt-0 pb-4 px-4">
        <!-- Ícone de erro do Remix Icon em vermelho -->
        <i class="ri-error-warning-fill text-danger" style="font-size: 4rem; line-height: 1;"></i>
        
        <!-- Título e Mensagem que serão substituídos pelo JS -->
        <h4 class="modal-title mt-3 mb-2 fw-bold text-dark" id="modalDeErroTitulo">Erro Inesperado</h4>
        <p class="text-secondary mb-4" id="modalDeErroMensagem">Ocorreu um problema ao processar sua solicitação.</p>
        
        <!-- Botão de ação -->
        <button type="button" class="btn btn-danger w-100 rounded-pill" data-bs-dismiss="modal">
          Entendi
        </button>
      </div>
      
    </div>
  </div>
</div>



			<h1 class="mb-4">Cadastro de Pacientes</h1>
            <form id="form-paciente" class="mb-5">
    
    <!-- 1. Linha dos Campos de Digitação -->
    <div class="row g-3 mb-4">

		<div class="col-md-4">
			<label for="nome" class="form-label text-secondary fw-semibold">Nome</label>
			<div class="position-relative wrapper-input">
				
			
				<span class="position-absolute top-50 start-0 translate-middle-y ms-3">
				
					<i class="ri-user-5-line anima-aceno text-secondary fs-5"></i>
				</span>
				
				<!-- Input -->
				<input type="text" class="form-control ps-5" id="nome" placeholder="Ex: João da Silva"  />
			</div>
		</div>

	<div class="col-md-4">
		<label for="email" class="form-label text-secondary fw-semibold">E-mail</label>
		<div class="position-relative wrapper-input">
			<span class="position-absolute top-50 start-0 translate-middle-y ms-3">
				<!-- Ícone de e-mail atualizado e mantendo a mesma classe de animação -->
				<i class="ri-mail-line anima-aceno text-secondary fs-5"></i>
			</span>
			<input type="email" class="form-control ps-5" id="email" placeholder="email@exemplo.com" />
		</div>
	</div>

        <div class="col-md-2">
            <label for="nascimento" class="form-label text-secondary fw-semibold">Nascimento</label>
            <input type="date" class="form-control" id="nascimento" />
        </div>

	<div class="col-md-2">
		<label for="telefone" class="form-label text-secondary fw-semibold">Telefone</label>
		<div class="position-relative wrapper-input">
			<span class="position-absolute top-50 start-0 translate-middle-y ms-3">
				<span class="fi fi-br small "></span>
			</span>
			<input type="text" class="form-control ps-5" id="telefone" placeholder="(00) 00000-0000"  />
		</div>
	</div>
    </div>

    <!-- 2. Linha de Ações (Checkbox e Botão) -->
    <div class="d-flex justify-content-between align-items-center bg-light p-3 border rounded">
        
        <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="checkSalvar" />
            <label class="form-check-label text-secondary" for="checkSalvar">
                <i class="ri-database-2-line"></i> Salvar em localStorage
            </label>
        </div>
        
        <button type="submit" class="btn btn-primary px-4">
           <i class="ri-user-smile-fill anima-aceno"></i> Cadastrar Paciente
        </button>
        
    </div>

</form>

			<!-- Tabela de pacientes -->
			<h2 class="h4 mb-3">Pacientes cadastrados</h2>

			<div class="row g-3 mb-5 align-items-center">
				<div class="col-md-6">
					<input type="text" id="busca" class="form-control" placeholder="Buscar por nome..." />
				</div>
				<div class="col-md-6 text-end">
					<div id="contador-pacientes">
						Total de pacientes: <span class="badge bg-primary" id="total-pacientes">0</span>
					</div>
				</div>
			</div>
			<table class="table table-striped">
				<thead>
					<tr>
						<th class="cursor-pointer" id="ordenar">Nome <i class="ri-arrow-up-s-fill "></i></th>
						<th>E-mail</th>
						<th>Data de nascimento</th>
						<th>Telefone</th>
						<th>Idade</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="tabela-pacientes">
					<tr><td  class="text-center align-middle" colspan="6">Nenhum paciente cadastrado</td></tr>
				</tbody>
			</table>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
